function renderClasses(){let host=document.getElementById('classes');if(selectedClass){let words=WORDS.filter(w=>w.grade===selectedClass),label=CLASSES.find(x=>x[0]===selectedClass)?.[1]||selectedClass;host.innerHTML=`<div class="class-head"><div><h2>${label} 단어</h2><p>이 클래스에 배정된 단어 ${words.length}개예요.</p></div><div style="display:flex;gap:8px"><button class="primary" onclick="startClassQuiz('${selectedClass}')">이 클래스 퀴즈 시작</button><button class="secondary" onclick="selectedClass=null;renderClasses()">← 클래스 목록</button></div></div><div class="word-grid">${words.map(w=>`<article class="word-card"><div class="word">${w.en} <button class="speak-button" onclick='speakWord(${JSON.stringify(w.en)})' aria-label="영어 발음 듣기">🔊</button></div><div class="pron">${w.pron?w.pron+' · ':''}${w.pos}</div>${w.example?`<div class="example">${w.example}<br>${w.exko}</div>`:''}<div class="card-foot"><span class="grade-pill">${label}</span></div></article>`).join('')}</div>`;return}host.innerHTML=`<div class="section-title"><div><h2>학년별 클래스</h2><p>학년을 선택하면 그 학년에 맞는 단어만 모아 볼 수 있어요.</p></div><span class="grade-pill">${CLASSES.length} CLASSES</span></div><div class="classes-grid">${CLASSES.map(([grade,label])=>{let count=WORDS.filter(w=>w.grade===grade).length;return `<button class="class-card" onclick="selectedClass='${grade}';renderClasses()"><span class="class-kicker">WORDSTEP CLASS</span><strong>${label}</strong><p>단계별 영어 단어 학습</p><span class="class-count">▤ ${count}개 단어 <span style="float:right;color:var(--purple)">열기 →</span></span></button>`}).join('')}</div>`}function rankScore(period){if(period==='daily')return studiedToday();if(period==='weekly'){let total=0;for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);total+=(state.daily[d.toLocaleDateString('en-CA')]||[]).length}return total}return Object.values(state.daily).reduce((sum,words)=>sum+words.length,0)}
function setRankPeriod(period){rankPeriod=period;renderRanking()}
function startClassQuiz(grade){quizScopeGrade=grade;selectedClass=null;go('study')}function startMyWordQuiz(){if(!state.customWords.length){alert('나의 단어장에 먼저 단어를 추가해 주세요.');return}quizScopeGrade='__custom__';go('study')}
function toggleClassSave(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];persist();renderClasses()}
function saveGoal(){let n=Math.min(100,Math.max(1,Number(document.getElementById('goalInput').value)||20));state.goal=n;persist();renderReport()}
initNav();go('dashboard');
</script>
</body>
</html>
